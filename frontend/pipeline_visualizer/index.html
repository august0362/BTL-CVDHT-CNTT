<!doctype html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#d7e7ed;font:13px system-ui,sans-serif;overflow:hidden}
#space{position:relative;width:100%;height:470px;overflow:hidden;background:#000;border:1px solid #17423f;border-radius:18px}
svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.edge{stroke:#24433f;stroke-width:2}.edge.active{stroke:#53f5d3;filter:drop-shadow(0 0 5px #37f4dc)}
.node{position:absolute;width:155px;min-height:76px;padding:12px;border:1px solid #25403e;border-radius:14px;background:#070a0a;box-shadow:0 8px 25px #000a;cursor:grab;user-select:none;transition:border-color .2s,box-shadow .2s,transform .2s}
.node:active{cursor:grabbing}.node:hover,.node.selected{border-color:#51f3d4;box-shadow:0 0 19px #2ce3c455;transform:translateY(-2px)}.node.running{border-color:#51f3d4;animation:pulse 1.4s infinite}.node.done{border-color:#22cba9}.node.error{border-color:#ff5d7e}.node.skipped{opacity:.45;border-style:dashed}
.title{font-weight:750;white-space:nowrap;font-size:12px;color:#e9f8f7}.state{font-size:10px;color:#c5d7d7;margin-top:8px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mark{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:7px;background:#133330;color:#82ffe6;margin-right:6px}
#detail{position:absolute;right:14px;top:14px;width:min(310px,34%);max-height:calc(100% - 28px);overflow:auto;padding:16px;background:#080b0b;border:1px solid #24615a;border-radius:14px;box-shadow:0 0 30px #23d5bb22;display:none}#detail.show{display:block}.close{float:right;border:0;background:none;color:#aaffeb;font-size:20px;cursor:pointer}.dt{font-size:15px;font-weight:800;color:#adfff0}.desc{line-height:1.55;color:#d1e1e2;margin-top:10px}.hint{position:absolute;bottom:10px;left:14px;color:#94aaaa;font-size:11px}
@keyframes pulse{50%{box-shadow:0 0 22px #2ce3c477}}
</style></head><body><div id="space"><svg id="edges"></svg><div id="nodes"></div><aside id="detail"><button class="close" id="close">×</button><div class="dt" id="dt"></div><div class="desc" id="desc"></div></aside><div class="hint">Kéo thả module · bấm module để xem thông tin · vị trí được lưu trên trình duyệt</div></div>
<script>
let N={statuses:{},selected:'input'};
const defs=[
 ['input','Ảnh đầu vào','Ảnh được nạp vào bộ nhớ phiên để xử lý.'],['yolo','YOLO · detector','Phát hiện khuôn mặt và tạo crop; kết quả quyết định nhánh một mặt hoặc nhiều mặt.'],
 ['esrgan','RealESRGAN · fallback','Thử tăng cường ảnh khi YOLO không tìm thấy khuôn mặt.'],['roll','3DDFA-V2 · roll','Ước lượng góc nghiêng và căn chỉnh hướng khuôn mặt.'],
 ['emoca','EMOCA · SFD / FAN / 3DMM','SFD tìm mặt, FAN tạo landmark; EMOCA dựng hình học 3D và attention.'],['alignment','RAF-DB · căn chỉnh','Chuẩn hoá ảnh khuôn mặt trước khi đưa vào bộ phân loại.'],
 ['poster','POSTER','Phân loại biểu cảm theo nhánh RAF-DB.'],['ma3d','MA3D-Net','Phân loại biểu cảm bằng đặc trưng hình học khuôn mặt 3D.']
];
const fallback={input:[24,180],yolo:[205,180],esrgan:[205,65],roll:[390,180],emoca:[575,180],alignment:[760,180],poster:[945,95],ma3d:[945,265]};
const saved=(()=>{try{return JSON.parse(localStorage.getItem('ps-node-positions')||'{}')}catch{return {}}})();
const coords={}, root=document.getElementById('space'), nodes=document.getElementById('nodes'), edges=document.getElementById('edges');
let selected='input', drag=null;
function resize(){const sx=root.clientWidth/1100, sy=root.clientHeight/470; defs.forEach(([id],i)=>{coords[id]=saved[id]||[fallback[id][0]*sx,fallback[id][1]*sy]})}
function draw(){nodes.innerHTML='';edges.innerHTML='';const visible=defs.filter(([id])=>!(N.statuses[id]||{}).state?.includes('hidden'));
 visible.forEach(([id,label,desc])=>{const s=N.statuses[id]||{state:'pending',detail:'Chờ dữ liệu'};let p=coords[id];const el=document.createElement('div');el.className='node '+s.state+(id===selected?' selected':'');el.dataset.id=id;el.style.left=p[0]+'px';el.style.top=p[1]+'px';el.innerHTML=`<div class="title"><span class="mark">${s.state==='done'?'✓':s.state==='running'?'◌':s.state==='error'?'!':'·'}</span>${label}</div><div class="state">${s.detail||s.state}</div>`;el.onpointerdown=e=>{if(e.target.closest('button'))return;drag={id,dx:e.clientX-p[0],dy:e.clientY-p[1]};el.setPointerCapture(e.pointerId)};el.onpointermove=e=>{if(!drag||drag.id!==id)return;coords[id]=[Math.max(0,e.clientX-drag.dx),Math.max(0,e.clientY-drag.dy)];el.style.left=coords[id][0]+'px';el.style.top=coords[id][1]+'px';connect()};el.onpointerup=()=>{if(drag?.id===id){drag=null;localStorage.setItem('ps-node-positions',JSON.stringify(coords))}};el.onclick=()=>{selected=id;document.getElementById('dt').textContent=label;document.getElementById('desc').textContent=desc+' '+(s.detail||'Chưa chạy trong lượt này.');document.getElementById('detail').classList.add('show');draw();Streamlit.setComponentValue({selected:id,positions:coords})};nodes.appendChild(el)});connect()}
function connect(){edges.innerHTML='';const pairs=[['input','yolo'],['yolo','esrgan'],['yolo','roll'],['esrgan','yolo'],['roll','emoca'],['emoca','alignment'],['alignment','poster'],['alignment','ma3d']];pairs.forEach(([a,b])=>{if(!coords[a]||!coords[b])return;const x1=coords[a][0]+77,y1=coords[a][1]+38,x2=coords[b][0]+77,y2=coords[b][1]+38;const line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',x1);line.setAttribute('y1',y1);line.setAttribute('x2',x2);line.setAttribute('y2',y2);line.setAttribute('class','edge '+((N.active===a||N.active===b)?'active':''));edges.appendChild(line)})}
document.getElementById('close').onclick=()=>document.getElementById('detail').classList.remove('show');
window.addEventListener('message',e=>{if(e.data.type==='streamlit:render'){N=e.data.args||{};selected=N.selected||selected;resize();draw()}});
window.addEventListener('load',()=>{Streamlit.setComponentReady();Streamlit.setFrameHeight(470)});
const Streamlit={setComponentReady(){window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*')},setComponentValue(v){window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:v},'*')},setFrameHeight(h){window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:h},'*')}};
</script></body></html>
