# configs/models.yaml — Registry mô hình FER (POSTER / MA3D-Net)
# Chủ sở hữu: 02_CONFIG_METRICS. Hình dạng theo CONTRACTS_ADR.md Phần C. Kiểm bằng:
#   python tests/test_configs.py            (nhanh: schema, file tồn tại, shape đầu phân loại)
#   python tests/test_configs.py --sha256   (thêm: băm lại mọi artifact, ~2.5 GB)
# Đường dẫn tương đối tính từ gốc dự án (BTL/). Artifact KHÔNG commit (giấy phép/dung lượng).

schema_version: 1

