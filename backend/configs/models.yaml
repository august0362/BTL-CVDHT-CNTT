# ---------------------------------------------------------------------------
# File bị cách ly — KHÔNG dùng. Bằng chứng: python tests/check_ma3d_checkpoints.py
# ---------------------------------------------------------------------------
quarantined:
  - path: model/ma3d/checkpoints/CheoFaMo_POSTER.pth
    sha256: a8162073aa172ad1d3f678f8e22033b9cfa3f0d399bb8254872bc5a1b64dc421
    reason: >-
      Không phải POSTER. archive_name "CheoFaMo_MA"; toàn bộ 1369 tensor giống từng byte với
      cheofamo_MA3D.pth (chỉ khác vỏ zip). Cần người dùng lấy lại đúng file POSTER CheoFaMo.
  - path: model/ma3d/checkpoints/ferplus_POSTER.pth
    sha256: d6841587c233b42ac128137812bd31fba4b7d15ae5555c9ca034f7c08c18a50a
    reason: >-
      Nhiều khả năng không phải POSTER. archive_name "ferplus_MA"; mm_fusion.* ĐÃ được huấn luyện
      (hàng nghìn trọng số vượt biên khởi tạo), trái với rafdb/caers POSTER (mm_fusion nguyên giá
      trị khởi tạo). Trọng số khác ferplus_MA3D.pth ⇒ có thể là một lần chạy MA3D khác.

# ---------------------------------------------------------------------------
# Registry. arch:
#   MA3D           — models/MA3D.py nguyên bản: forward(x, x_3d) có mm_fusion; cần mã 3DMM + stats.
#   MA3D_no_fusion — POSTER theo ADR-011: cùng lớp MA3D, nạp cùng state_dict, forward BỎ QUA
#                    mm_fusion (không cần mã 3DMM). Bằng chứng: mm_fusion.* trong checkpoint POSTER
#                    nằm trọn trong biên khởi tạo (chưa từng nhận gradient).
# labels: đúng thứ tự chỉ số đầu ra. null = chưa xác minh ⇒ bắt buộc enabled: false.
# ---------------------------------------------------------------------------
models:
  - id: poster_rafdb
    display_name: "POSTER (RAF-DB)"
    arch: MA3D_no_fusion
    dataset: RAF-DB
    num_classes: 7
    # Thứ tự RAF-DB: label = int(thư_mục) − 1 (model/ma3d/Read_dataset/RAF_DB.py:42), thư mục 1..7.
    # Xác minh bằng 2 nguồn trong repo nhóm: scripts/tsne.py:19-27 (EMOTION_NAMES 0..6) và
    # Read_dataset/DatasetCheo.py:9-12 (EMOTIONS); cả hai trùng quy ước công bố của RAF-DB
    # (1 Surprise, 2 Fear, 3 Disgust, 4 Happiness, 5 Sadness, 6 Anger, 7 Neutral).
    # Chưa đối chiếu được thư mục dữ liệu thật (Datasets/ không có trong bản clone).
    labels: [surprise, fear, disgust, happiness, sadness, anger, neutral]
    ckpt: raf_poster_ckpt
    stats: null            # POSTER không dùng 3DMM
    backbones: {ir50: ir50, mobilefacenet: mobilefacenet}
    enabled: true
    notes: >-
      POSTER theo thiết lập huấn luyện của nhóm (ADR-011), không đồng nhất với bản công bố.
      Log: model/ma3d/log/raf_POSTER.txt, best val acc 90.44%.

  - id: ma3d_rafdb
    display_name: "MA3D-Net (RAF-DB)"
    arch: MA3D
    dataset: RAF-DB
    num_classes: 7
    # Thứ tự nhãn: nguồn như poster_rafdb; ĐÃ xác nhận khớp với checkpoint (người dùng, 2026-09-25, thông tin từ nhóm train).
    labels: [surprise, fear, disgust, happiness, sadness, anger, neutral]
    ckpt: raf_ma3d_ckpt
    stats: raf_emoca_stats # rafdb_emoca_stats.npz (artifact ở trên). Vẫn cần mã 3DMM THẬT từ EMOCA thật, xem web/engine.py `codes_real`
    backbones: {ir50: ir50, mobilefacenet: mobilefacenet}
    enabled: true
    notes: >-
      Log: model/ma3d/log/raf_MA3D.txt (resume path checkpoints/raf_MA.pth).
      Tên raf_MA3D.pth (Drive) ↔ raf_MA.pth (log) là giả thuyết, chưa kiểm.

  - id: poster_caers
    display_name: "POSTER (CAER-S)"
    arch: MA3D_no_fusion
    dataset: CAER-S
    num_classes: 7
    labels: null           # sorted(tên thư mục) lúc chạy (Read_dataset/Caers.py:20-22) — cần thư mục thật
    ckpt: caers_poster_ckpt
    stats: null
    backbones: {ir50: ir50, mobilefacenet: mobilefacenet}
    enabled: false
    notes: "Chờ xác minh nhãn."

  - id: ma3d_caers
    display_name: "MA3D-Net (CAER-S)"
    arch: MA3D
    dataset: CAER-S
    num_classes: 7
    labels: null
    ckpt: caers_ma3d_ckpt
    stats: null
    backbones: {ir50: ir50, mobilefacenet: mobilefacenet}
    enabled: false
    notes: "Chờ xác minh nhãn và caers_emoca_stats.npz."

  - id: ma3d_ferplus
    display_name: "MA3D-Net (FERPlus)"
    arch: MA3D
    dataset: FERPlus
    num_classes: 8
    labels: null           # sorted(tên thư mục) (Read_dataset/FER_Plus.py:19-23) — cần thư mục thật
    ckpt: ferplus_ma3d_ckpt
    stats: null
    backbones: {ir50: ir50, mobilefacenet: mobilefacenet}
    enabled: false
    notes: "Chờ xác minh nhãn và stats. Chưa có POSTER FERPlus hợp lệ (xem quarantined)."

  - id: ma3d_cheofamo
    display_name: "MA3D-Net (CheoFaMo)"
    arch: MA3D
    dataset: CheoFaMo
    num_classes: 6
    labels: null           # sorted(tập nhãn trong JSON) (Read_dataset/Cheo_FaMo.py:66-68)
    ckpt: cheofamo_ma3d_ckpt
    stats: null
    backbones: {ir50: ir50, mobilefacenet: mobilefacenet}
    enabled: false
    notes: "Chờ xác minh nhãn và stats. Chưa có POSTER CheoFaMo hợp lệ (xem quarantined)."

# Cặp so sánh mặc định trên giao diện (PROJECT_CONTEXT §1: POSTER vs MA3D-Net, RAF-DB).
default_comparison: [poster_rafdb, ma3d_rafdb]
