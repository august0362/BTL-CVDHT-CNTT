# configs/align.yaml — Mẫu 5 điểm cho căn chỉnh ảnh vào POSTER/MA3D-Net (ADR-020)
# Chủ sở hữu: 01_AI (dữ liệu) + 02_CONFIG_METRICS (vị trí). Đọc bởi web/face_align.py; kiểm bằng tests/test_configs.py.
# Vì sao tệp riêng, không nằm trong models.yaml: mẫu căn chỉnh là tiền xử lý DÙNG CHUNG cho mọi checkpoint train trên
# RAF-DB aligned, có nguồn gốc/trạng thái riêng; tách ra để không đổi schema registry mà engine + test_engine_* đang dựa vào.
# Liên kết mô hình ↔ mẫu (vd `preprocess: rafdb_aligned_100` trong models.yaml) để GENERAL quyết khi mẫu được xác minh.
#
# Hệ toạ độ (bất biến §1.7): pixel của ẢNH ĐÃ CĂN CHỈNH, (0,0) là TÂM pixel trên-trái, x sang phải, y xuống — CÙNG
# quy ước với `landmarks.original_px` của EMOCA (skimage), FAN và cv2. Thứ tự 5 điểm (chỉ số 68 điểm, 0-based):
#   0 tâm mắt bên TRÁI ẢNH (TB 36–41) · 1 tâm mắt bên PHẢI ẢNH (TB 42–47) · 2 đỉnh mũi (30) · 3 khoé miệng trái ảnh (48)
#   · 4 khoé miệng phải ảnh (54)

schema_version: 1

# Căn chỉnh BẬT (2026-09-29): đã đo mẫu THẬT từ 41 ảnh RAF-DB aligned (`database/image/archive`) bằng FAN (face_alignment
# 1.3.6, env work38) và estimate_template — xem `source` dưới. Đo A/B trên 41 ảnh test: crop "lỏng" (mô phỏng crop
# EMOCA 224 hiện tại) → 14,6%; sau căn chỉnh → 80,5% (≈ baseline RAF aligned). ⇒ bật mặc định, web đưa ảnh căn chỉnh
# vào POSTER/MA3D-Net (ADR-020). Muốn tắt tạm: đặt enabled: false.
enabled: true

templates:
  rafdb_aligned_100:
    size: [100, 100]           # [rộng, cao] — RAF-DB basic "aligned" 100×100 (README model/ma3d; RAF_DB.py:49,85-86)
    points:                    # [x, y] theo thứ tự ở trên
      - [26.78, 32.84]
      - [72.22, 32.84]
      - [49.50, 55.54]
      - [30.04, 73.04]
      - [68.96, 73.04]
    status: measured           # provisional | measured — đo từ ảnh RAF-DB aligned thật
    source: >-
      ĐO ĐƯỢC (2026-09-29, 01_AI): FAN 68 landmark (face_alignment 1.3.6, env work38, WSL) trên 41 ảnh RAF-DB
      aligned `test` (6 ảnh/lớp) trong database/image/archive; 5 điểm = tâm hai mắt (TB 36–41 / 42–47), đỉnh mũi (30),
      khoé miệng (48, 54); estimate_template (TB từng điểm + đối xứng qua trục x = 49,5). Độ lệch chuẩn từng điểm
      1–3 px (mắt), ~7 px (mũi); residual sau Umeyama trung bình ~5,4 px (nhiễu mũi + biến thiên vốn có của RAF-DB
      aligned). Sai khác rõ với mẫu ArcFace tạm cũ: mắt cao hơn ~13 px (y 32,8 vs 46,2) ⇒ crop RAF-DB aligned LỎNG
      hơn (chừa nhiều tóc/trán). Mẫu cũ (provisional) bị loại vì làm mặt quá chặt/sai vị trí.
